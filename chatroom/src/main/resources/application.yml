# Spring Boot PostgreSQL 設定
spring:
  datasource: 
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://localhost:5432/chatroom_db"
    username: "postgres"
    password: "admin1234"
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  avatar-dir: uploads/avatars
